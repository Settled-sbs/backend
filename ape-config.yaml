name: settled

plugins:
  - name: vyper
  - name: avalanche

default_ecosystem: avalanche

vyper:
  version: "0.4.3"
  enable_decimals: true
  evm_version: "shanghai"

networks:
  avalanche:
    fuji:
      default_provider: node
      providers: alchemy, node
  
  # Define Robinhood as a custom ecosystem
  custom:
    - name: mainnet
      ecosystem: robinhood
      base_ecosystem_plugin: ethereum
      chain_id: 4663
      default_provider: node
    - name: testnet
      ecosystem: robinhood
      base_ecosystem_plugin: ethereum
      chain_id: 46630
      default_provider: node

node:
  avalanche:
    fuji:
      url: "https://api.avax-test.network/ext/bc/C/rpc"
      chain_id: 43113
      explorer: "https://testnet.snowtrace.io"
  
  # Robinhood Public RPCs (Rate-limited, best for testing)
  robinhood:
    mainnet:
      uri: "https://rpc.mainnet.chain.robinhood.com"
      chain_id: 4663
      explorer: "https://robinhoodchain.blockscout.com"
    testnet:
      uri: "https://rpc.testnet.chain.robinhood.com"
      chain_id: 46630
      explorer: "https://explorer.testnet.chain.robinhood.com"

  ethereum:
    local:
      provider: foundry

alchemy:
  avalanche:
    fuji:
      uri: "https://avax-fuji.g.alchemy.com/v2/${WEB3_ALCHEMY_API_KEY}"
      chain_id: 43113
      explorer: "https://testnet.snowtrace.io"
      
  # Robinhood Alchemy RPCs (Recommended for production)
  robinhood:
    mainnet:
      uri: "https://robinhood-mainnet.g.alchemy.com/v2/${WEB3_ALCHEMY_API_KEY}"
      chain_id: 4663
      explorer: "https://robinhoodchain.blockscout.com"
    testnet:
      uri: "https://robinhood-testnet.g.alchemy.com/v2/${WEB3_ALCHEMY_API_KEY}"
      chain_id: 46630
      explorer: "https://explorer.testnet.chain.robinhood.com"